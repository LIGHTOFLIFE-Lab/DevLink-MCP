name: Release

# PyInstaller can only build for the system it runs on, so each artifact is
# produced on its own runner and attached to one release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# or run this from the Actions tab to produce the artifacts without tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            script: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1
          - os: macos-14
            label: macOS (Apple Silicon)
            script: bash packaging/build_macos.sh
          - os: macos-13
            label: macOS (Intel)
            script: bash packaging/build_macos.sh
          - os: ubuntu-latest
            label: Linux (x64)
            script: bash packaging/build_linux.sh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The build scripts make their own venv; point them at one inside the
      # workspace so the runner's Python stays untouched.
      - name: Build
        shell: bash
        run: ${{ matrix.script }}

      # A binary that cannot start is worse than no binary. Prove it runs, and
      # that it still behaves like the command line, before it goes anywhere
      # near a release page — the MCP client registration depends on
      # `<binary> serve --home ...` working.
      - name: Locate the binary
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) echo "BIN=$(ls dist/DevLink-MCP-*-windows-x64.exe)" >> "$GITHUB_ENV" ;;
            macOS)   echo "BIN=dist/DevLink-MCP.app/Contents/MacOS/DevLink-MCP" >> "$GITHUB_ENV" ;;
            Linux)   echo "BIN=dist/DevLink-MCP" >> "$GITHUB_ENV" ;;
          esac

      - name: Smoke test — command line
        shell: bash
        run: |
          "$BIN" --version
          "$BIN" init --home "$RUNNER_TEMP/dl"
          test -f "$RUNNER_TEMP/dl/config/servers.ini"
          "$BIN" check --home "$RUNNER_TEMP/dl" || test $? -le 1

      - name: Smoke test — the panel answers
        shell: bash
        run: |
          # No browser on a runner, and no fixed port in normal use, so pin one.
          "$BIN" gui --home "$RUNNER_TEMP/dl" --port 8791 --no-browser &
          for _ in $(seq 1 30); do
            sleep 1
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/ || true)
            [ "$code" = "200" ] && echo "panel answered" && exit 0
          done
          echo "the settings panel never answered" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Download the file for your system and open it. The settings panel
            appears in your browser. Python is inside the download; there is
            nothing else to install.

            | System | File |
            |---|---|
            | Windows 10/11 | `DevLink-MCP-…-windows-x64.exe` |
            | macOS, Apple Silicon | `DevLink-MCP-…-macos-arm64.dmg` |
            | macOS, Intel | `DevLink-MCP-…-macos-x86_64.dmg` |
            | Linux | `DevLink-MCP-…-linux-x86_64.tar.gz` |

            **These builds are not code-signed**, so the first launch asks you
            to confirm:

            - Windows SmartScreen: *More info* → *Run anyway*
            - macOS Gatekeeper: right-click the app → *Open* → *Open*, or
              `xattr -dr com.apple.quarantine /Applications/DevLink-MCP.app`

            Verify a download against the matching `.sha256` file if you like.

            Prefer to install from source? `pip install devlink-mcp` gives you
            the same program.
