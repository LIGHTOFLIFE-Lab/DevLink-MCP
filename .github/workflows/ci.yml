name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Adds a "Run workflow" button on the Actions tab, so anyone can trigger the
  # suite from the browser without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Deploy and rollback are tested against a local directory standing in
      # for a server, so no SSH host is needed — but git is, and the tests
      # commit, so give it an identity.
      - name: Configure git
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # The integration test needs an SSH server it can start itself. Linux
      # runners have one; the test skips where they do not, so make it visible
      # here whether it actually ran rather than silently skipping everywhere.
      - name: Show what the integration test will do
        shell: bash
        run: |
          if command -v sshd >/dev/null || [ -x /usr/sbin/sshd ]; then
            echo "sshd present - the live SSH tests will run"
          else
            echo "no sshd - the live SSH tests will skip"
          fi

      - name: Test
        run: python -m pytest -q -rs

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
