; ============================================================
;  sshpier — server list
;
;  This file contains passwords. Keep it out of version control.
;  이 파일에는 비밀번호가 들어갑니다. 깃에 올리지 마세요.
;
;  Copy to:  $SSHPIER_HOME/config/servers.ini
;  Check it: sshpier check
; ============================================================

; Values here apply to every section below, and a section can override them.
; 여기 값은 아래 모든 섹션에 상속되고, 섹션에서 다시 쓰면 덮어씁니다.
[DEFAULT]
port    = 22
mode    = exec
exclude = data/, files/, upload/, uploads/, cache/, tmp/, *.log, *.sql, node_modules/, .env, .git/
backup  = /var/backup/sshpier

; lang = ko          ; force the interface language (en / ko)


; ------------------------------------------------------------
;  The section name is how you refer to the server.
;  섹션 이름이 이 서버를 부르는 이름입니다.
; ------------------------------------------------------------

[web1]
host     = 10.0.0.1
user     = root
password = CHANGE_ME
remote   = /var/www/html


; Key authentication — preferred. Use 'key' instead of 'password'.
; 개인키 인증 (권장). password 대신 key 를 씁니다.
[example-key]
enabled    = no
host       = example.com
port       = 2222
user       = deploy
key        = ~/.sshpier/config/keys/deploy.pem
; passphrase = secret          ; only if the key has one
remote     = /var/www/html
backup     = /var/backup/sshpier


; A jump host, or anything that needs the login banner and profile to finish
; before commands work. Note: file transfer is unavailable in this mode.
; 점프서버처럼 로그인 배너·profile 을 기다려야 하는 경우. 파일 전송은 불가합니다.
[example-jump]
enabled = no
host    = bastion.example.com
user    = ops
key     = ~/.sshpier/config/keys/ops.pem
mode    = shell
remote  = /srv/app


; ------------------------------------------------------------
;  Optional settings / 선택 항목
; ------------------------------------------------------------
;
;  allow     = ^ls( .*)?|^cat .*|^df.*   ; only these commands may run.
;                                          Strongly recommended in production.
;                                          운영 서버에는 이걸 권합니다.
;  deny      = ^systemctl .*             ; added to the built-in deny list
;  proxy     = socks5://127.0.0.1:1080   ; SOCKS5 / HTTP / HTTPS
;  timeout   = 60                        ; command timeout, seconds
;  maxoutput = 10                        ; output cap, MB
;  template  = su root -c <quotedCommand>  ; wrap every command
;  name      = other-name                ; connection name, if not the section
;  enabled   = no                        ; keep the entry but do not use it
